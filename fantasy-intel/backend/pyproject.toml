[project]
name = "fantasy-intel-backend"
version = "0.1.0"
description = "Local fantasy football intelligence backend (FastAPI + DuckDB)"
requires-python = ">=3.11"
# Runtime dependencies are only what the API needs, so the hosted (Vercel) bundle stays under
# its size limit. The sync scripts' packages live in the `sync` group, which `dev` includes, so
# a plain `uv sync` still installs everything locally (Vercel installs with --no-dev).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.2",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "numpy>=2.4.6",
    "requests>=2.31",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt>=2.9",
    "cryptography>=43",
]

[dependency-groups]
sync = ["espn-api>=1.0.1", "nflreadpy>=0.1.5", "polars>=1.0"]
# Offline research only (scripts/hgb_research.py). Never imported by the API; Vercel's
# `uv sync --no-dev` skips it, and tests/test_hgb_research.py asserts the API never loads sklearn.
research = ["scikit-learn>=1.5"]
dev = [{include-group = "sync"}, {include-group = "research"}, "pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"
