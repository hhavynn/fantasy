[project]
name = "fantasy-intel-backend"
version = "0.1.0"
description = "Local fantasy football intelligence backend (FastAPI + DuckDB)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.2",
    "espn-api>=1.0.1",
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
