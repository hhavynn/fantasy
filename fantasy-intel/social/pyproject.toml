[project]
name = "fantasy-intel-social"
version = "0.1.0"
description = "Social trend intelligence: public NFL discussion -> ranked trends -> data-backed video ideas"
requires-python = ">=3.11"
# Deliberately small: no torch, no browser. yt-dlp is an external binary (brew install yt-dlp).
dependencies = [
    "duckdb>=1.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pytz>=2024.1",  # DuckDB needs it to return TIMESTAMPTZ values
]

[project.optional-dependencies]
# Semantic embeddings for clustering (static model2vec vectors, CPU-only, ~30 MB). TF-IDF is used without it.
embeddings = ["model2vec>=0.4"]
# Instagram needs a logged-in instaloader session; anonymous access returns 401.
instagram = ["instaloader>=4.15"]

[project.scripts]
trends = "social_intel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.21", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E702", "B008", "B905"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["social_intel"]
