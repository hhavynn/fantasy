# fantasy-intel studio configuration. Paths are relative to this file unless absolute.
# Environment overrides: STUDIO_DB (database path), STUDIO_EPISODES (output directory).

season = 2026
db_path = "../data/fantasy.duckdb"
episodes_dir = "episodes"

[cta]
# Empty until the public site ships; the CTA then points viewers at this URL.
url = ""
channel_line = "Subscribe for the usage report every week. Our free usage tool is coming soon."

[llm]
provider = "llamacpp"                      # llamacpp | fake
base_url = "http://127.0.0.1:8080/v1"
model = "Qwen3-30B-A3B-Instruct-2507-Q4_K_M"
model_repo = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
model_file = "~/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
model_license = "Apache-2.0"
temperature = 0.7
max_tokens = 2000
max_retries = 4
presence_penalty = 0.5
repeat_penalty = 1.05

[tts]
engine = "kokoro"
repo = "hexgrad/Kokoro-82M"
license = "Apache-2.0"
voice = "am_michael"
speed = 1.12
sample_rate = 24000
segment_tail_silence = 0.35

[video]
fps = 30
long_size = [1920, 1080]
short_size = [1080, 1920]

[selection]
# Players need this many games before the week to have a trend (backend trends.MIN_GAMES_FOR_TREND).
risers = 5
fallers = 4
max_per_position = 3
# Featured players from the most recent N episodes are de-prioritised.
recent_episode_window = 2

[duration]
long_min = 480
long_max = 720
short_min = 15
short_max = 45

[shorts]
# Stories per week (about three is sustainable to review): the strongest sustained moves, one per team.
risers = 2
fallers = 1
# From this week a "role first, schedule second" Weeks 15-17 beat joins each Short.
playoff_runway_from_week = 11
# Short-form delivery: a Kokoro blend, 70% am_puck + 30% af_heart, at 1.25x, re-voiced with the owner's enrolled
# voice (voice_clone below), chosen by the channel owner from a side-by-side listening test (2026-10-16). It
# replaces am_adam, which stays the AI host's voice ([presenter] voice). Kokoro's own clip padding trimmed.
voice = "am_puck:0.7+af_heart:0.3"
# Multiplies every line's speed, including script per-line speeds. The flame/praise series divides it back out of
# its own per-format speeds (stages/showrunner.FORMATS), which are already tuned for short-form pace.
speed_scale = 1.25
trim_silence = true
segment_tail_silence = 0.12
# Original procedural music bed and sound design (no third-party audio). Set music = false for voice only.
music = true
# ESPN player headshots in place of the jersey graphic. Not licensed to the channel (see studio/headshots.py):
# set false to go back to the jersey everywhere if copyright claims start.
headshots = true
music_db = -28.0
sfx_db = -12.0
# The channel owner's enrolled voice (see voices/RECORDING.md). Empty = Kokoro's own voice.
# Kokoro still performs; OpenVoice V2 re-voices it. QC blocks publishing without a valid consent record.
voice_clone = "havyn"
# Default hook per storyline; empty = rotate least recently used.
hook = ""

[presenter]
# EXPERIMENTAL AI host layer (studio/presenter.py). off | hook | hybrid. Off keeps the pipeline exactly as before;
# hook/hybrid also write final_presenter_<mode>.mp4 next to final.mp4, which is never changed.
mode = "off"
# MuseTalk 1.5 (musetalk-mac) install with its own .venv and weights; see docs/presenter/README.md
engine = "~/models/musetalk-mac"
# base clips, lip-sync clips and landmark caches (large, outside the repo)
cache = "~/models/presenter"
# the fictional host, generated once with Z-Image-Turbo (Apache-2.0); see assets/presenter/host.json
portrait = "assets/presenter/host.png"
# The host's own voice (picked by audition: episodes/presenter-audition). Host versions are re-rendered as
# <slug>-host with this voice. The Shorts now use the owner's blend + enrolled voice ([shorts]), so the two differ
# again and host versions are re-rendered separately (presenter.py).
voice = "am_adam"
# Realism pass 2 (A/B in episodes/presenter-review, docs/presenter/README.md). engine_mode "hq" = lossless
# native-fps MuseTalk loop with skin-detail restore, approved by the owner from the montages (2026-10-15).
# motion "library" = audited Wan2.2 natural-motion clips of the same host (falls back to procedural if none
# pass), approved by the owner from the pass-2 montages (variant D, 2026-10-15).
engine_mode = "hq"
motion = "library"
library = "~/models/presenter/motion/library"
detail = 1.0
detail_sigma = 3.5

[editorial_media]
# EXPERIMENTAL re-edit of each Short with real photography, B-roll and its own graphics (stages/editorial_media.py,
# docs/editorial-media/README.md). off | preview | render. preview writes the storyboard only; render also writes
# <slug>-editorial/final.mp4. The original Short is never changed. Media comes from assets/media/manifest.json;
# a video using media no person has approved yet fails the publish check.
mode = "off"

[graphics]
# Graphic style for Shorts (studio/graphics, tokens in assets/styles/*.toml): original | premium | pixel |
# broadcast | auto. 'original' renders only final.mp4, exactly as before. Any other value ALSO renders
# styles/<style>/final.mp4 with its own QC; final.mp4 is never replaced.
style = "auto"
# auto: [graphics.auto] per-angle overrides first, then auto_default; a story with a scene the style has no
# design for falls back to original.
auto_default = "premium"          # the website's look for every story it has a design for

[graphics.auto]
# Per-angle overrides, e.g. fill_in = "broadcast" or comparison = "pixel". Empty: premium everywhere.

[export]
# Hand-upload bundles (stages/export.py). Limits checked 2026-10-30; change them here when an app changes them.
[export.tiktok]
max_caption = 2200
max_hashtags = 5
story_lines = 1                   # the title and one line read best; the rest is cut off behind "more"
[export.reels]
max_caption = 2200
max_hashtags = 5                  # Instagram's cap since December 2025
[export.shorts]
max_title = 100
max_description = 5000
max_seconds = 180
