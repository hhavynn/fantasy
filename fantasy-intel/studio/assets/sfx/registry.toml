# The flame / praise series' meme sounds: real soundboard clips people recognise (myinstants.com trending, Oct
# 2026). The audio is NOT in git (soundboard clips carry no license we hold): `uv run python -m studio.sfx_fetch`
# downloads each `source` into assets/sfx/meme/. The channel owner chose to use them knowing a Content ID claim or a
# muted clip is the realistic risk; videos that use them are flagged in metadata (contains_soundboard_audio).
#
# trim: seconds kept from the file. hit: seconds from the trim start to where it gets loud (measured: the first
# point at a third of its peak), the moment that lands on the word.
# level_db: loudness against the narration (0 = as loud as the voice). contexts: the jokes it is for; a cue asks for a
# context and gets the sound made for it. fallback: the procedural sound used when the file is missing.

