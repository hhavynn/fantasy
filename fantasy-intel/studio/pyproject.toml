[project]
name = "fantasy-intel-studio"
version = "0.1.0"
description = "Local YouTube episode pipeline built on fantasy-intel NFL usage data"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.2",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pillow>=10.4",
    "soundfile>=0.12",
    # Kokoro-82M TTS (Apache-2.0 code + weights). misaki G2P runs with fallback=None, so the
    # GPL espeak-ng fallback is never installed or used.
    "kokoro>=0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
make-episode = "studio.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.hatch.metadata]
allow-direct-references = true
