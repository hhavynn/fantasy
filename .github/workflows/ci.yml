name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-shard:
    # The suite runs as parallel shards (balanced by tests/shard_weights.json; whole files except the heaviest), each with its
    # own Postgres service. Rebuild the weights with scripts/shard_weights.py when the shards drift apart.
    name: Backend shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: fantasy-intel/backend
    env:
      TZ: UTC
      # Control-plane tests (tests/pg_harness.py) run against this service; locally they use a throwaway initdb cluster.
      FI_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "fantasy-intel/backend/uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Run backend pytest shard
        run: uv run pytest --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  backend:
    # One status for the whole suite: green only when every shard passed.
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    needs: backend-shard
    if: always()
    steps:
      - name: Every shard passed
        run: test "${{ needs.backend-shard.result }}" = success

  social:
    name: Social trend engine (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy-intel/social
    env:
      TZ: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "fantasy-intel/social/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check social_intel tests

      - name: Run tests (fixtures only, no network)
        run: uv run pytest

  frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy-intel/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "fantasy-intel/frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Run production build
        run: npm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fantasy-intel/frontend
    env:
      TZ: UTC
      # The multi-league parity matrix's control plane (scripts/e2e_multileague.py via tests/pg_harness.py)
      FI_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "fantasy-intel/backend/uv.lock"

      - name: Install backend dependencies
        working-directory: fantasy-intel/backend
        run: uv sync --frozen

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "fantasy-intel/frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build frontend
        run: npm run build

      # Playwright starts the backend on the synthetic DuckDB (scripts/build_e2e_db.py) and `next start`.
      - name: Run route smoke test
        run: npm run e2e

      # The same pages for a Sleeper league (scripts/build_e2e_sleeper.py): no error and no ESPN wording.
      - name: Run Sleeper league smoke test
        run: npm run e2e:sleeper

      # Every page on the multi-league site for an ESPN public, an ESPN private (signed in) and a Sleeper league:
      # throwaway Postgres, a fake Supabase JWKS and three published league files (scripts/e2e_multileague.py).
      - name: Run multi-league parity matrix
        run: npm run e2e:multileague

      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            fantasy-intel/frontend/test-results/
            fantasy-intel/frontend/playwright-report/
            fantasy-intel/frontend/test-results-sleeper/
            fantasy-intel/frontend/playwright-report-sleeper/
            fantasy-intel/frontend/test-results-multileague/
            fantasy-intel/frontend/playwright-report-multileague/
          retention-days: 14
